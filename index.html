<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>pirpi's Python Studio — IDE Python pédagogique</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e1e1e'/%3E%3Cpath d='M9 8l9 8-9 8' fill='none' stroke='%234fc1ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 24h6' stroke='%23ffd43b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applique le thème avant le premier rendu (évite un flash blanc).
      try {
        var t = localStorage.getItem('pystudio.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <!--
      Pour les hébergeurs qui ne permettent pas de définir des en-têtes HTTP
      (GitHub Pages), ce script les injecte via un Service Worker.
      Il ne fait rien si la page est déjà isolée (Netlify, Vercel, Cloudflare, dev local).
    -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
